<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
  <title>班级学员管理业务流程</title>
  <rect width="760" height="480" fill="#f8fafc"/>
  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">班级 · 学员管理业务流程</text>
  <g font-size="12" fill="#1e293b">
    <rect x="30" y="56" width="100" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="80" y="81" text-anchor="middle">学员列表</text>
    <rect x="160" y="56" width="100" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="210" y="81" text-anchor="middle">条件筛选</text>
    <rect x="290" y="56" width="100" height="40" rx="6" fill="#dcfce7" stroke="#16a34a"/>
    <text x="340" y="81" text-anchor="middle">详情/修改</text>
    <rect x="420" y="56" width="100" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="470" y="81" text-anchor="middle">学员导入</text>
    <rect x="550" y="56" width="180" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="640" y="81" text-anchor="middle">校区/类别/班级/H5</text>
    <rect x="40" y="140" width="680" height="300" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="170" font-weight="600">主要路径</text>
    <text x="60" y="200">列表: 多条件查询 - 详情/修改/禁用 - 保存或取消</text>
    <text x="60" y="228">导入: 下载模板 - 上传 Excel - 校验 - 结果提示</text>
    <text x="60" y="256">班级: 维护校区与类别 - 班级管理 - H5 邀请码</text>
    <text x="60" y="300" fill="#64748b">参考 Axure 班级管理-学员管理 Tab 与子页</text>
  </g>
</svg>
